<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" role="img"

<title id="title">Rozmarra architecture</title>
<desc id="desc">Data sources feed an offline pipeline that fits the twins, creates synthetic fasting days and trains the models. The core package uses the twins and models inside a FastAPI service, which serves the doctor dashboard and the printed patient plan.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8794"/></marker></defs>
<text x="30" y="52" font-size="32" font-weight="700" fill="#1f2933">Rozmarra architecture</text>
<text x="30" y="86" font-size="17" fill="#52606d">A digital twin that helps doctors plan safer religious fasts for people with Type 2 Diabetes in India. Team NOT_SOMEONE_IMPORTANT, IIT (ISM) Dhanbad.</text>
<rect x="30" y="120" width="330" height="760" rx="14" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="46" y="150" font-size="21" font-weight="700" fill="#1f2933">1. Data sources</text>
<text x="46" y="172" font-size="14" fill="#52606d">Open anonymised data and synthetic data only</text>
<rect x="50" y="190" width="290" height="110" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="64" y="218" font-size="18" font-weight="700" fill="#1f2933">ShanghaiT2DM</text>
<text x="64" y="242" font-size="15" fill="#52606d">Real open CGM data, China</text>
<text x="64" y="263" font-size="15" fill="#52606d">Licence: CC BY 4.0</text>
<rect x="50" y="320" width="290" height="130" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
<text x="64" y="348" font-size="18" font-weight="700" fill="#1f2933">CGMacros</text>
<text x="64" y="372" font-size="15" fill="#52606d">Real open CGM and smartwatch</text>
<text x="64" y="393" font-size="15" fill="#52606d">data, United States</text>
<text x="64" y="414" font-size="15" fill="#52606d">Licence: CC BY-NC-SA 4.0</text>
<rect x="50" y="470" width="290" height="130" rx="10" fill="#f3e8fd" stroke="#6a1b9a" stroke-width="2"/>
<text x="64" y="498" font-size="18" font-weight="700" fill="#1f2933">Synthetic health records</text>
<text x="64" y="522" font-size="15" fill="#52606d">FHIR R4 bundles with medicines,</text>
<text x="64" y="543" font-size="15" fill="#52606d">CYP2C9 and IDF-DAR inputs</text>
<text x="64" y="564" font-size="15" fill="#52606d">(labelled as synthetic)</text>
<rect x="50" y="620" width="290" height="130" rx="10" fill="#f3e8fd" stroke="#6a1b9a" stroke-width="2"/>
<text x="64" y="648" font-size="18" font-weight="700" fill="#1f2933">Fasting templates</text>
<text x="64" y="672" font-size="15" fill="#52606d">Navratri, Karva Chauth,</text>
<text x="64" y="693" font-size="15" fill="#52606d">Ekadashi, Ramadan, Jain fasts,</text>
<text x="64" y="714" font-size="15" fill="#52606d">Chhath Puja and custom fasts</text>
<rect x="50" y="770" width="290" height="100" rx="10" fill="#f3e8fd" stroke="#6a1b9a" stroke-width="2"/>
<text x="64" y="798" font-size="18" font-weight="700" fill="#1f2933">Four demo patients</text>
<text x="64" y="822" font-size="15" fill="#52606d">Records and fasting days that</text>
<text x="64" y="843" font-size="15" fill="#52606d">the API serves to the dashboard</text>
<rect x="400" y="120" width="380" height="760" rx="14" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="416" y="150" font-size="21" font-weight="700" fill="#1f2933">2. Offline pipeline</text>
<text x="416" y="172" font-size="14" fill="#52606d">The rozmarra command-line tool (Python 3.12)</text>
<rect x="420" y="190" width="340" height="90" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="434" y="218" font-size="18" font-weight="700" fill="#1f2933">Data loading</text>
<text x="434" y="242" font-size="15" fill="#52606d">Standard Parquet tables (data prepare)</text>
<rect x="420" y="300" width="340" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="434" y="328" font-size="18" font-weight="700" fill="#1f2933">Twin fitting</text>
<text x="434" y="352" font-size="15" fill="#52606d">One physiology twin for each of</text>
<text x="434" y="373" font-size="15" fill="#52606d">89 real patients (twin fit)</text>
<rect x="420" y="430" width="340" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="434" y="458" font-size="18" font-weight="700" fill="#1f2933">Synthetic fasting days</text>
<text x="434" y="482" font-size="15" fill="#52606d">500 virtual patients and 1,500</text>
<text x="434" y="503" font-size="15" fill="#52606d">fasting episodes (synth cohort)</text>
<rect x="420" y="560" width="340" height="110" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="434" y="588" font-size="18" font-weight="700" fill="#1f2933">Features and labels</text>
<text x="434" y="612" font-size="15" fill="#52606d">CGM, history, twin forecasts,</text>
<text x="434" y="633" font-size="15" fill="#52606d">wearables, fast and record</text>
<rect x="420" y="690" width="340" height="170" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="434" y="718" font-size="18" font-weight="700" fill="#1f2933">Training and evaluation</text>
<text x="434" y="742" font-size="15" fill="#52606d">LightGBM with isotonic calibration</text>
<text x="434" y="763" font-size="15" fill="#52606d">Tests on held-out real days and</text>
<text x="434" y="784" font-size="15" fill="#52606d">100 test virtual patients</text>
<text x="434" y="805" font-size="15" fill="#52606d">Writes models/ and reports/</text>
<text x="434" y="826" font-size="15" fill="#52606d">(model train, model evaluate)</text>
<rect x="820" y="120" width="380" height="760" rx="14" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="836" y="150" font-size="21" font-weight="700" fill="#1f2933">3. Rozmarra core at run time</text>
<text x="836" y="172" font-size="14" fill="#52606d">The rozmarra Python package inside the API</text>
<rect x="840" y="190" width="340" height="90" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="854" y="218" font-size="18" font-weight="700" fill="#1f2933">IDF-DAR 2021 score</text>
<text x="854" y="242" font-size="15" fill="#52606d">Clinical risk score and safety rules</text>
<rect x="840" y="300" width="340" height="130" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="854" y="328" font-size="18" font-weight="700" fill="#1f2933">Physiology twin</text>
<text x="854" y="352" font-size="15" fill="#52606d">Glucose, insulin, meals, medicines</text>
<text x="854" y="373" font-size="15" fill="#52606d">and activity; 100 samples give</text>
<text x="854" y="394" font-size="15" fill="#52606d">the uncertainty band</text>
<rect x="840" y="450" width="340" height="130" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="854" y="478" font-size="18" font-weight="700" fill="#1f2933">Prediction models</text>
<text x="854" y="502" font-size="15" fill="#52606d">Low glucose within 60 minutes,</text>
<text x="854" y="523" font-size="15" fill="#52606d">high glucose after the fast and</text>
<text x="854" y="544" font-size="15" fill="#52606d">whole-fast forecasts</text>
<rect x="840" y="600" width="340" height="90" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="854" y="628" font-size="18" font-weight="700" fill="#1f2933">Reasons (SHAP)</text>
<text x="854" y="652" font-size="15" fill="#52606d">Fixed English and Hindi sentences</text>
<rect x="840" y="710" width="340" height="150" rx="10" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="854" y="738" font-size="18" font-weight="700" fill="#1f2933">Patient plan templates</text>
<text x="854" y="762" font-size="15" fill="#52606d">Fixed Jinja2 templates in English</text>
<text x="854" y="783" font-size="15" fill="#52606d">and Hindi; no AI-written advice</text>
<text x="854" y="804" font-size="15" fill="#52606d">Approvals stored in SQLite</text>
<rect x="1240" y="120" width="330" height="760" rx="14" fill="none" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1256" y="150" font-size="21" font-weight="700" fill="#1f2933">4. Applications</text>
<text x="1256" y="172" font-size="14" fill="#52606d">What the doctor and the patient see</text>
<rect x="1260" y="190" width="290" height="110" rx="10" fill="#fff8e1" stroke="#b26a00" stroke-width="2"/>
<text x="1274" y="218" font-size="18" font-weight="700" fill="#1f2933">FastAPI service</text>
<text x="1274" y="242" font-size="15" fill="#52606d">REST endpoints for patients,</text>
<text x="1274" y="263" font-size="15" fill="#52606d">plans, replays and the model card</text>
<rect x="1260" y="330" width="290" height="340" rx="10" fill="#fff8e1" stroke="#b26a00" stroke-width="2"/>
<text x="1274" y="358" font-size="18" font-weight="700" fill="#1f2933">Doctor dashboard</text>
<text x="1274" y="382" font-size="15" fill="#52606d">React, TypeScript, Tailwind CSS</text>
<text x="1274" y="403" font-size="15" fill="#52606d">English and Hindi</text>
<text x="1274" y="424" font-size="15" fill="#52606d"></text>
<text x="1274" y="445" font-size="15" fill="#52606d">1. Patients who plan to fast</text>
<text x="1274" y="466" font-size="15" fill="#52606d">2. Virtual patient</text>
<text x="1274" y="487" font-size="15" fill="#52606d">3. Test a fasting plan</text>
<text x="1274" y="508" font-size="15" fill="#52606d">4. Live fasting monitor</text>
<text x="1274" y="529" font-size="15" fill="#52606d">5. Patient fasting plan</text>
<text x="1274" y="550" font-size="15" fill="#52606d">6. How Rozmarra makes</text>
<text x="1274" y="571" font-size="15" fill="#52606d">    predictions</text>
<rect x="1260" y="700" width="290" height="160" rx="10" fill="#fff8e1" stroke="#b26a00" stroke-width="2"/>
<text x="1274" y="728" font-size="18" font-weight="700" fill="#1f2933">Printed patient plan</text>
<text x="1274" y="752" font-size="15" fill="#52606d">English or Hindi, after the</text>
<text x="1274" y="773" font-size="15" fill="#52606d">doctor approves the plan</text>
<text x="1274" y="794" font-size="15" fill="#52606d">The doctor makes every</text>
<text x="1274" y="815" font-size="15" fill="#52606d">treatment decision</text>

<text x="60" y="921" font-size="15" fill="#1f2933">Real open data</text>
<rect x="230" y="908" width="22" height="16" rx="3" fill="#f3e8fd" stroke="#6a1b9a" stroke-width="2"/>
<text x="260" y="921" font-size="15" fill="#1f2933">Synthetic data</text>
<rect x="430" y="908" width="22" height="16" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
<text x="460" y="921" font-size="15" fill="#1f2933">Offline pipeline</text>
<rect x="630" y="908" width="22" height="16" rx="3" fill="#e0f2f1" stroke="#00695c" stroke-width="2"/>
<text x="660" y="921" font-size="15" fill="#1f2933">Core at run time</text>
<rect x="830" y="908" width="22" height="16" rx="3" fill="#fff8e1" stroke="#b26a00" stroke-width="2"/>
<text x="860" y="921" font-size="15" fill="#1f2933">Applications</text>
<text x="30" y="966" font-size="15" fill="#52606d">All patients in the dashboard are synthetic. The real data comes only from open anonymised datasets, and no raw data is stored in the repository.</text>
<text x="30" y="990" font-size="15" fill="#52606d">Rozmarra is a research prototype that supports the doctor. It is not a certified medical device, and no doctor or pharmacist has reviewed its clinical content.</text>
