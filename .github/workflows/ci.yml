# GitHub Actions runs these checks on every push and pull request.
name: Checks

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests and code style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the backend packages
        run: uv sync --locked
      - name: Check the code style with Ruff
        run: uv run ruff check .
      - name: Run the tests
        run: uv run pytest
      - name: Check the English text against the writing standard
        run: uv run rozmarra check-language

  frontend:
    name: Dashboard tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the dashboard packages
        run: npm ci
      - name: Run the tests
        run: npm run test
      - name: Build the dashboard
        run: npm run build
