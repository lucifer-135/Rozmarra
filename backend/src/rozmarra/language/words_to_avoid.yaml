# Words and phrases to avoid in English text, from docs/prd.md, Section 17.3.
# The command "rozmarra check-language" reads this list. Each entry gives a
# pattern (a regular expression that matches whole words, ignoring case) and the
# words to use instead.
#
# The check skips this file itself, the "Not:" examples in the writing standard,
# the original titles of references, the names of other projects and the column
# names of the datasets, because these must keep their original wording.

- pattern: '\bhypos?\b'
  use_instead: low blood sugar (for patients), or hypoglycaemia (for doctors)
- pattern: '\bhyper\b'
  use_instead: high blood sugar, or hyperglycaemia
- pattern: '\bspikes?\b'
  use_instead: a sharp rise in glucose
- pattern: '\b(BG|BGL)\b'
  use_instead: blood glucose, or blood sugar
- pattern: '\bsugars\b'
  use_instead: blood glucose, or blood sugar
- pattern: '\b(SU|OHA)\b'
  use_instead: sulfonylurea; oral diabetes medicine
- pattern: '\b(pt|pts)\b'
  use_instead: patient, patients
- pattern: '\bmeds\b'
  use_instead: medicines
- pattern: '\bRx\b'
  use_instead: prescription
- pattern: '\bw/o?(?=\s)'
  use_instead: with, without
- pattern: '\bapprox\.'
  use_instead: about
- pattern: '\bASAP\b'
  use_instead: as soon as possible
- pattern: '\bguaranteed?\b'
  use_instead: may reduce, helps identify, or the measured accuracy
- pattern: '\bprevents\b'
  use_instead: may reduce, or helps identify
- pattern: '\b100% accurate\b'
  use_instead: the measured accuracy
- pattern: '\bAI (decides|knows)\b'
  use_instead: the model estimates
- pattern: '\bsigns? off\b'
  use_instead: approves
